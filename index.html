<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A24;
    --paper:#FAF7EF;
    --paper-2:#F1ECDD;
    --line:#DCD4BC;
    --line-strong:#C6BB98;
    --petrol:#0F3D3E;
    --petrol-2:#155352;
    --brass:#B8892F;
    --brass-light:#EFDCAF;
    --danger:#A5372B;
    --danger-bg:#F6E4DF;
    --muted:#6E6A5C;
    --shadow: 0 1px 2px rgba(15,61,62,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:16px;
    border-bottom:2px solid var(--petrol);
    padding-bottom:18px;margin-bottom:26px;
  }
  .brand-block h1{
    font-family:'Zilla Slab',serif;
    font-weight:600;font-size:30px;margin:0 0 4px;color:var(--petrol);
  }
  .brand-block p{margin:0;color:var(--muted);font-size:14px;}
  .brand-tabs{display:flex;gap:8px;}
  .brand-tabs-wrap{position:relative;}
  .brand-tab{
    padding:8px 16px;border:1px solid var(--line-strong);border-radius:7px;
    background:var(--paper);color:var(--muted);font-family:'Inter';font-size:14px;
    font-weight:500;cursor:pointer;
  }
  .brand-tab.active{
    background:var(--petrol);color:#fff;border-color:var(--petrol);
  }

  .metrics{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;
  }
  .metric{
    background:var(--paper-2);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;
  }
  .metric .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .metric .value{font-family:'Zilla Slab',serif;font-size:22px;font-weight:600;color:var(--petrol);}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;margin-bottom:26px;box-shadow:var(--shadow);
  }
  .panel h2{
    font-family:'Zilla Slab',serif;font-size:17px;font-weight:600;
    margin:0 0 16px;color:var(--petrol);
    border-bottom:1px solid var(--line);padding-bottom:10px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }
  .field label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:5px;
    letter-spacing:0.3px;
  }
  .field input, .field select{
    width:100%;height:38px;border:1px solid var(--line-strong);border-radius:7px;
    background:var(--paper);padding:0 10px;font-family:'Inter';font-size:14px;color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--petrol);box-shadow:0 0 0 2px rgba(15,61,62,0.12);
  }
  .form-actions{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;}
  button{font-family:'Inter';cursor:pointer;}
  .btn{
    height:38px;padding:0 18px;border-radius:7px;border:1px solid var(--line-strong);
    background:#fff;color:var(--ink);font-size:14px;font-weight:500;
  }
  .btn:hover{background:var(--paper-2);}
  .btn-primary{
    background:var(--petrol);border-color:var(--petrol);color:#fff;
  }
  .btn-primary:hover{background:var(--petrol-2);}
  .err{color:var(--danger);font-size:12px;margin-top:4px;display:none;}

  .table-toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;flex-wrap:wrap;gap:10px;
  }
  .table-toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filters select, .filters input{
    height:34px;border:1px solid var(--line-strong);border-radius:7px;
    background:#fff;padding:0 10px;font-size:13px;font-family:'Inter';
  }
  table{
    width:100%;border-collapse:collapse;background:#fff;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
    font-size:13.5px;
  }
  thead th{
    background:var(--petrol);color:#fff;font-weight:500;
    padding:10px 8px;text-align:center;white-space:nowrap;
  }
  tbody td{
    padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;
  }
  tbody tr:nth-child(even){background:var(--paper-2);}
  tbody tr:hover{background:var(--brass-light);}
  td.items-cell{text-align:left;}
  td.total-cell{font-weight:700;color:var(--petrol);}
  .row-actions{display:flex;gap:6px;justify-content:center;}
  .icon-btn{
    width:28px;height:28px;border-radius:6px;border:1px solid var(--line-strong);
    background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .icon-btn.del:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);}
  .icon-btn.edit:hover{background:var(--brass-light);}
  tfoot td{
    background:var(--paper-2);font-weight:700;color:var(--petrol);
    padding:10px 8px;border-top:2px solid var(--petrol);
  }
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--muted);
  }
  .empty-state strong{display:block;color:var(--petrol);font-size:16px;margin-bottom:6px;font-family:'Zilla Slab',serif;}

  @media (max-width:720px){
    .metrics{grid-template-columns:repeat(2,1fr);}
    table{font-size:12px;}
    thead th, tbody td{padding:7px 5px;}
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--petrol);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:14px;font-weight:500;opacity:0;pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .branch-totals-inline{
    position:absolute;top:calc(100% + 8px);right:0;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;box-shadow:0 4px 14px rgba(15,61,62,0.12);
    z-index:20;min-width:200px;max-width:260px;
    opacity:0;visibility:hidden;transform:translateY(-4px);
    transition:opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    pointer-events:none;
  }
  .brand-tabs-wrap:hover .branch-totals-inline,
  .brand-tabs-wrap:focus-within .branch-totals-inline{
    opacity:1;visibility:visible;transform:translateY(0);
    pointer-events:auto;
  }
  .branch-totals-grid{
    display:flex;flex-direction:column;gap:8px;
  }
  .branch-total-card{
    border-radius:7px;padding:7px 10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .branch-total-card .bname{font-size:12px;font-weight:500;}
  .branch-total-card .bqty{font-size:10.5px;opacity:0.8;}
  .branch-total-card .bvalue{font-family:'Zilla Slab',serif;font-size:14px;font-weight:600;white-space:nowrap;}
  .branch-totals-empty{color:var(--muted);font-size:12.5px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand-block">
      <h1>Invoice & Stock Ledger</h1>
      <p id="brandSubtitle">Fareeq Bin Aqool — 9 branches</p>
    </div>
    <div class="brand-tabs-wrap">
      <div class="brand-tabs">
        <button class="brand-tab active" data-brand="Fareeq Bin Aqool">Fareeq Bin Aqool</button>
      </div>
      <div id="branchTotalsHost" class="branch-totals-inline"></div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Invoices logged</div><div class="value" id="mCount">0</div></div>
    <div class="metric"><div class="label">Total quantity</div><div class="value" id="mQty">0</div></div>
    <div class="metric"><div class="label">Total value (BHD)</div><div class="value" id="mTotal">0.000</div></div>
    <div class="metric"><div class="label">Last updated</div><div class="value" id="mUpdated" style="font-size:14px;">—</div></div>
  </div>

  <div class="panel">
    <h2 id="formTitle">Add new entry</h2>
    <div class="form-grid">
      <div class="field">
        <label>CODE</label>
        <select id="fCode"></select>
      </div>
      <div class="field">
        <label>DATE</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>ITEMS</label>
        <input type="text" id="fItems" placeholder="Item name" list="itemsList">
        <datalist id="itemsList">
          <option value="CORINDER LEAVES">
          <option value="PARSELY">
          <option value="SPINACH">
          <option value="SPINT">
          <option value="BAGAL">
          <option value="MINT LEAVES">
          <option value="CURRY LEAVES">
          <option value="RED ONION">
          <option value="GARLIC">
          <option value="POTATO">
          <option value="GINGER">
          <option value="TOMATO">
          <option value="COULIFLOWER">
          <option value="CUCUMBER">
          <option value="EGGPLANT">
          <option value="LEMON">
          <option value="OKRA">
          <option value="GREEN CHILLY">
          <option value="CARROT">
          <option value="CABBAGE WHITE">
          <option value="CHILLY LONG">
          <option value="GREEN CAPSICUM">
          <option value="ICEBERG LITTUS">
          <option value="BITTER GUARD">
          <option value="BEBY MARROW">
        </datalist>
      </div>
      <div class="field">
        <label>PACK</label>
        <input type="text" id="fPack" placeholder="Packaging type">
      </div>
      <div class="field">
        <label>INVOICE</label>
        <input type="text" id="fInvoice" placeholder="Invoice number">
      </div>
      <div class="field">
        <label>BRANCH</label>
        <select id="fBranch">
          <option value="Aali">Aali</option>
          <option value="Hamad Town">Hamad Town</option>
          <option value="Jeblat Hebshi">Jeblat Hebshi</option>
          <option value="Malikya">Malikya</option>
          <option value="Muharraq">Muharraq</option>
          <option value="Saar">Saar</option>
          <option value="Sanad">Sanad</option>
          <option value="Sitra">Sitra</option>
          <option value="Zinj">Zinj</option>
        </select>
      </div>
      <div class="field">
        <label>QTY</label>
        <input type="number" id="fQty" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>PRICE</label>
        <input type="number" id="fPrice" min="0" step="0.001" placeholder="0.000">
      </div>
      <div class="field">
        <label>TOTAL</label>
        <input type="text" id="fTotalDisplay" disabled placeholder="0.000">
      </div>
    </div>
    <div class="err" id="formErr">Enter a valid item, quantity and price.</div>
    <div class="form-actions">
      <button class="btn" id="cancelEdit" style="display:none;">Cancel edit</button>
      <button class="btn btn-primary" id="saveBtn">Save entry</button>
    </div>
  </div>

  <div class="table-toolbar">
    <div class="filters">
      <select id="filterBranch">
        <option value="">All branches</option>
      </select>
      <input type="date" id="filterDate">
      <button class="btn" id="clearFilters">Clear filters</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn" id="importBtn">Import CSV</button>
      <input type="file" id="importFile" accept=".csv" style="display:none;">
      <button class="btn" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div id="tableHost"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const BRANCHES = ["Aali","Hamad Town","Jeblat Hebshi","Malikya","Muharraq","Saar","Sanad","Sitra","Zinj"];
const BRANCH_COLORS = {
  "Aali": {bg:"#DCE7E4", text:"#0F3D3E"},
  "Hamad Town": {bg:"#F3E4C4", text:"#8A611E"},
  "Jeblat Hebshi": {bg:"#E7D8CC", text:"#6B4226"},
  "Malikya": {bg:"#DEE7DA", text:"#3F5C3A"},
  "Muharraq": {bg:"#EFDADA", text:"#8B3A3A"},
  "Saar": {bg:"#D9E2EA", text:"#33526E"},
  "Sanad": {bg:"#E6DCE8", text:"#654178"},
  "Sitra": {bg:"#E2E7D3", text:"#556B2F"},
  "Zinj": {bg:"#F1DFCB", text:"#A65D2E"}
};
const STORAGE_KEY = "invoice_ledger_entries_en";
let entries = [];
let currentBrand = "Fareeq Bin Aqool";
let editingId = null;

const $ = (id) => document.getElementById(id);

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt3(n){ return (Math.round(n*1000)/1000).toFixed(3); }

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  $('fCode').value = '';
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Could not save data', e);
  }
}

function nextNo(){
  const brandEntries = entries.filter(e => e.brand === currentBrand);
  return brandEntries.length ? Math.max(...brandEntries.map(e => e.no)) + 1 : 1;
}

const CODE_ITEMS = [
  "CORINDER LEAVES","PARSELY","SPINACH","SPINT","BAGAL","MINT LEAVES","CURRY LEAVES",
  "RED ONION","GARLIC","POTATO","GINGER","TOMATO","COULIFLOWER","CUCUMBER","EGGPLANT",
  "LEMON","OKRA","GREEN CHILLY","CARROT","CABBAGE WHITE","CHILLY LONG","GREEN CAPSICUM",
  "ICEBERG LITTUS","BITTER GUARD","BEBY MARROW"
];

function populateCodeSelect(){
  const sel = $('fCode');
  sel.innerHTML = '';
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = 'Select code';
  sel.appendChild(blank);
  CODE_ITEMS.forEach((item, i) => {
    const opt = document.createElement('option');
    opt.value = String(i + 1);
    opt.textContent = `${i + 1} — ${item}`;
    sel.appendChild(opt);
  });
}

function applyCodeToItems(){
  const code = parseInt($('fCode').value, 10);
  if(code >= 1 && code <= CODE_ITEMS.length){
    $('fItems').value = CODE_ITEMS[code - 1];
    $('fQty').focus();
  }
}

function resetForm(){
  editingId = null;
  $('fCode').value = '';
  $('fDate').value = todayStr();
  $('fItems').value = '';
  $('fPack').value = '';
  $('fInvoice').value = '';
  $('fBranch').value = BRANCHES[0];
  $('fQty').value = '';
  $('fPrice').value = '';
  $('fTotalDisplay').value = '0.000';
  $('formErr').style.display = 'none';
  $('formTitle').textContent = 'Add new entry';
  $('cancelEdit').style.display = 'none';
  $('fCode').focus();
}

function updateTotalPreview(){
  const q = parseFloat($('fQty').value) || 0;
  const p = parseFloat($('fPrice').value) || 0;
  $('fTotalDisplay').value = fmt3(q*p);
}

let toastTimer = null;
function showToast(message){
  const t = $('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function saveEntry(){
  const items = $('fItems').value.trim();
  const qty = parseFloat($('fQty').value);
  const price = parseFloat($('fPrice').value);
  if(!items || isNaN(qty) || qty < 0 || isNaN(price) || price < 0){
    $('formErr').style.display = 'block';
    return;
  }
  $('formErr').style.display = 'none';

  const data = {
    date: $('fDate').value || todayStr(),
    items: items,
    code: $('fCode').value.trim(),
    pack: $('fPack').value.trim(),
    invoice: $('fInvoice').value.trim(),
    branch: $('fBranch').value,
    qty: qty,
    price: price,
    total: qty*price,
    brand: currentBrand
  };

  const wasEditing = editingId !== null;
  if(editingId !== null){
    const idx = entries.findIndex(e => e.id === editingId);
    if(idx > -1){
      entries[idx] = {...entries[idx], ...data};
    }
  }else{
    entries.push({ id: Date.now()+Math.random(), no: nextNo(), ...data });
  }
  persist();
  resetForm();
  render();
  showToast(wasEditing ? 'Entry updated' : 'Entry saved');
}

function startEdit(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  editingId = id;
  $('fDate').value = e.date;
  $('fItems').value = e.items;
  $('fCode').value = e.code;
  $('fPack').value = e.pack;
  $('fInvoice').value = e.invoice;
  $('fBranch').value = e.branch;
  $('fQty').value = e.qty;
  $('fPrice').value = e.price;
  updateTotalPreview();
  $('formTitle').textContent = 'Edit entry #' + e.no;
  $('cancelEdit').style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  persist();
  render();
}

function filteredEntries(){
  let list = entries.filter(e => e.brand === currentBrand);
  const fb = $('filterBranch').value;
  const fd = $('filterDate').value;
  if(fb) list = list.filter(e => e.branch === fb);
  if(fd) list = list.filter(e => e.date === fd);
  return list.sort((a,b) => a.no - b.no);
}

function render(){
  const list = filteredEntries();
  const host = $('tableHost');

  if(list.length === 0){
    host.innerHTML = `<div class="empty-state" style="background:#fff;border:1px solid var(--line);border-radius:10px;">
      <strong>No entries yet</strong>
      Add your first invoice entry using the form above.
    </div>`;
  } else {
    let rows = list.map(e => `
      <tr>
        <td>${e.no}</td>
        <td>${escapeHtml(e.code)||'—'}</td>
        <td>${e.date}</td>
        <td class="items-cell">${escapeHtml(e.items)}</td>
        <td class="items-cell">${escapeHtml(e.pack)||'—'}</td>
        <td>${escapeHtml(e.invoice)||'—'}</td>
        <td class="items-cell">${branchBadge(e.branch)}</td>
        <td>${e.qty}</td>
        <td>${fmt3(e.price)}</td>
        <td class="total-cell">${fmt3(e.total)}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn edit" title="Edit" onclick="startEdit(${e.id})">✎</button>
            <button class="icon-btn del" title="Delete" onclick="deleteEntry(${e.id})">🗑</button>
          </div>
        </td>
      </tr>
    `).join('');

    const sumQty = list.reduce((s,e)=>s+e.qty,0);
    const sumTotal = list.reduce((s,e)=>s+e.total,0);

    host.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>NO</th><th>CODE</th><th>DATE</th><th>ITEMS</th><th>PACK</th><th>INVOICE</th>
            <th>BRANCH</th><th>QTY</th><th>PRICE</th><th>TOTAL</th><th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr>
            <td colspan="7">Total</td>
            <td>${sumQty}</td>
            <td></td>
            <td>${fmt3(sumTotal)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    `;
  }

  const allBrandEntries = entries.filter(e => e.brand === currentBrand);
  $('mCount').textContent = allBrandEntries.length;
  $('mQty').textContent = allBrandEntries.reduce((s,e)=>s+e.qty,0);
  $('mTotal').textContent = fmt3(allBrandEntries.reduce((s,e)=>s+e.total,0));
  $('mUpdated').textContent = allBrandEntries.length ? new Date().toLocaleDateString('en-GB') : '—';

  renderBranchTotals(allBrandEntries);
  updateFilterBranchOptions(allBrandEntries);
}

function renderBranchTotals(brandEntries){
  const host = $('branchTotalsHost');
  if(!brandEntries.length){
    host.innerHTML = `<div class="branch-totals-empty">No entries yet for this brand.</div>`;
    return;
  }
  const sums = {};
  brandEntries.forEach(e => {
    if(!sums[e.branch]) sums[e.branch] = {qty:0, total:0};
    sums[e.branch].qty += e.qty;
    sums[e.branch].total += e.total;
  });
  const cards = BRANCHES
    .filter(b => sums[b])
    .map(b => {
      const c = BRANCH_COLORS[b] || {bg:"#EDEAE0", text:"#6E6A5C"};
      const s = sums[b];
      return `<div class="branch-total-card" style="background:${c.bg};color:${c.text};">
        <div class="bname">${escapeHtml(b)}</div>
        <div class="bqty">Qty: ${s.qty}</div>
        <div class="bvalue">${fmt3(s.total)} BHD</div>
      </div>`;
    }).join('');
  host.innerHTML = `<div class="branch-totals-grid">${cards}</div>`;
}

function branchBadge(branch){
  const c = BRANCH_COLORS[branch] || {bg:"#EDEAE0", text:"#6E6A5C"};
  return `<span style="display:inline-block;padding:3px 10px;border-radius:6px;background:${c.bg};color:${c.text};font-weight:500;font-size:12.5px;">${escapeHtml(branch)}</span>`;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function exportCSV(){
  const list = filteredEntries();
  if(!list.length){ return; }
  const header = ["NO","CODE","DATE","ITEMS","PACK","INVOICE","BRANCH","QTY","PRICE","TOTAL"];
  const rows = list.map(e => [e.no, e.code, e.date, e.items, e.pack, e.invoice, e.branch, e.qty, fmt3(e.price), fmt3(e.total)]);
  const csv = [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentBrand}_ledger_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function parseCSVLine(line){
  const result = [];
  let cur = '';
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else{ inQuotes = false; }
      }else{
        cur += ch;
      }
    }else{
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur); cur = ''; }
      else{ cur += ch; }
    }
  }
  result.push(cur);
  return result;
}

function importCSV(file){
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if(lines.length < 2){
      showToast('No data found in file');
      return;
    }
    const header = parseCSVLine(lines[0]).map(h => h.trim().toUpperCase());
    const idx = {
      no: header.indexOf('NO'),
      code: header.indexOf('CODE'),
      date: header.indexOf('DATE'),
      items: header.indexOf('ITEMS'),
      pack: header.indexOf('PACK'),
      invoice: header.indexOf('INVOICE'),
      branch: header.indexOf('BRANCH'),
      qty: header.indexOf('QTY'),
      price: header.indexOf('PRICE'),
      total: header.indexOf('TOTAL')
    };
    if(idx.items === -1 || idx.qty === -1 || idx.price === -1){
      showToast('CSV format not recognized');
      return;
    }
    let imported = 0;
    for(let i = 1; i < lines.length; i++){
      const cols = parseCSVLine(lines[i]);
      const items = (cols[idx.items] || '').trim();
      const qty = parseFloat(cols[idx.qty]);
      const price = parseFloat(cols[idx.price]);
      if(!items || isNaN(qty) || isNaN(price)) continue;
      entries.push({
        id: Date.now() + Math.random(),
        no: nextNo(),
        code: idx.code > -1 ? (cols[idx.code] || '').trim() : '',
        date: idx.date > -1 ? (cols[idx.date] || '').trim() || todayStr() : todayStr(),
        items: items,
        pack: idx.pack > -1 ? (cols[idx.pack] || '').trim() : '',
        invoice: idx.invoice > -1 ? (cols[idx.invoice] || '').trim() : '',
        branch: (idx.branch > -1 && BRANCHES.includes((cols[idx.branch]||'').trim())) ? cols[idx.branch].trim() : BRANCHES[0],
        qty: qty,
        price: price,
        total: qty * price,
        brand: currentBrand
      });
      imported++;
    }
    if(imported > 0){
      persist();
      render();
      showToast(`${imported} ${imported === 1 ? 'entry' : 'entries'} imported`);
    }else{
      showToast('No valid rows found');
    }
  };
  reader.readAsText(file);
}

function updateFilterBranchOptions(brandEntries){
  const sums = {};
  brandEntries.forEach(e => {
    if(!sums[e.branch]) sums[e.branch] = {qty:0, total:0};
    sums[e.branch].qty += e.qty;
    sums[e.branch].total += e.total;
  });
  const sel = $('filterBranch');
  const prevValue = sel.value;
  sel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = `All branches (${brandEntries.length} · ${fmt3(brandEntries.reduce((s,e)=>s+e.total,0))} BHD)`;
  sel.appendChild(allOpt);
  BRANCHES.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b;
    const s = sums[b];
    opt.textContent = s ? `${b} (${s.qty} · ${fmt3(s.total)} BHD)` : `${b} (0)`;
    sel.appendChild(opt);
  });
  sel.value = prevValue;
}

    if(ev.key === 'Enter'){
      ev.preventDefault();

        nextEl.focus();
        if(nextEl.select) nextEl.select();

      }
    }
  });
});
